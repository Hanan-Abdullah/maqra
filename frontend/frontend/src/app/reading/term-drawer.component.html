<dga-drawer-v2 class="term-drawer" [open]="isOpen()" [placement]="phone() ? 'bottom' : 'end'" size="md"
  [label]="term() ? 'مصطلح: ' + term()!.term : 'مصطلح'" (openChange)="onOpenChange($event)">
  @if (term(); as t) {
    <dga-drawer-header close-label="إغلاق">
      <span slot="title" class="dr-title"><span class="dr-kicker">مصطلح</span>{{ t.term }}</span>
      @if (t.translation) { <span slot="description" class="dr-tr" dir="ltr">{{ t.translation }}</span> }
    </dga-drawer-header>
    <dga-drawer-body>
      <div class="dr-body">
        <section class="dr-sec">
          <h3 class="dr-label"><dga-icon name="information-circle"></dga-icon>المعنى</h3>
          <p>{{ t.meaning }}</p>
        </section>
        @if (t.explanation) {
          <section class="dr-sec">
            <h3 class="dr-label"><dga-icon name="idea-01"></dga-icon>الشرح</h3>
            <p>{{ t.explanation }}</p>
          </section>
        }
        @if (t.example) {
          <section class="dr-sec ex">
            <h3 class="dr-label"><dga-icon name="note-edit"></dga-icon>مثال</h3>
            <p>{{ t.example }}</p>
          </section>
        }
      </div>
    </dga-drawer-body>
    <dga-drawer-footer><p class="dr-count">ورد في النص {{ times() }}</p></dga-drawer-footer>
  }
</dga-drawer-v2>
